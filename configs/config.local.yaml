service:
  name: kubeflare
  environment: local

http:
  address: ":8000"
  allowed_origins:
    - "*"

auth:
  signing_key: local-development-signing-key-change-me
  cookie_secure: false

database:
  enabled: false

redis:
  enabled: false

secrets:
  encryption_key: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f

upload:
  root_dir: data/uploads

kapi:
  blocked_namespaces: []

ai:
  enabled: true
  default_provider: deepseek
  providers:
    deepseek:
      type: openai_compatible
      base_url: https://api.deepseek.com
      chat_path: /chat/completions
      api_key: ${KUBEFLARE_AI__PROVIDERS__DEEPSEEK__API_KEY}
      model: deepseek-v4-flash
      timeout: 30s
      stream: true
      temperature: 0.7
      max_tokens: 4096
