service:
  name: kubeflare
  environment: production

http:
  address: ":8000"
  read_timeout: 30s
  read_header_timeout: 10s
  write_timeout: 0s
  idle_timeout: 90s
  shutdown_timeout: 20s
  drain_timeout: 5s
  api_request_timeout: 10s
  max_header_bytes: 1048576
  trusted_proxies: []
  allowed_origins:
    - https://kubeflare.example.com
  allow_credentials: false
  allow_headers:
    - Authorization
    - Content-Type
    - X-Request-Id
    - X-Kubeflare-CSRF
  allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  enable_pprof: false
  readiness_timeout: 2s

auth:
  signing_key: ${KUBEFLARE_AUTH__SIGNING_KEY}
  token_ttl: 24h
  refresh_token_ttl: 168h
  max_failed_attempts: 5
  lockout_duration: 15m
  captcha_failure_trigger: 3
  captcha_ttl: 5m
  cookie_secure: true
  cookie_domain: ""
  oidc:
    enabled: false
    issuer_url: ""
    client_id: ""
    client_secret: ""
    redirect_url: ""
    scopes:
      - openid
      - profile
      - email

kapi:
  blocked_namespaces:
    - kube-system
    - kube-public
    - kube-node-lease
  max_concurrent_sessions_per_user: 5

ai:
  enabled: false
  default_provider: deepseek
  # 对话助手(非 Agent)的系统提示词,留空则使用 Kubeflare 智能助手默认自我认知。
  system_prompt: "当前角色: 面向用户的 Kubernetes 运维助手。请用简洁、专业的中文回答运维与云原生问题。"
  providers:
    deepseek:
      type: openai_compatible
      base_url: https://api.deepseek.com
      chat_path: /chat/completions
      # api_key 支持两种形式:
      #   1) 明文(含通过 ${ENV} 注入的明文),向后兼容;
      #   2) 密文:用与 secrets.encryption_key 同一把密钥加密、带 "enc:v1:" 前缀的串,
      #      避免密钥明文落配置文件。两者启动时自动识别。
      api_key: ${KUBEFLARE_AI__PROVIDERS__DEEPSEEK__API_KEY}
      model: deepseek-chat
      timeout: 30s
      stream_timeout: 5m
      stream: true
      temperature: 0.7
      max_tokens: 4096
      max_retries: 2               # 对网络错误/429/5xx 的最大重试次数,0 表示不重试
      retry_backoff: 500ms         # 首次重试退避基数,后续指数增长
      # include_stream_usage: true # 流式是否请求 token 用量统计(默认开,个别 provider 可关)
  # 可选:文本向量化(embedding)provider,配置后启用 Agent 的语义检索(案例库/
  # 路由样例按语义相似度召回,而非关键词字面匹配)。留空(不配置 embedding)时
  # 语义检索自动降级关键词匹配,行为与今日一致(零回归)。走独立端点与模型,可
  # 指向与 chat 不同的服务商。api_key 同样支持明文或 enc:v1: 密文。
  # embedding:
  #   type: openai_compatible
  #   base_url: https://api.openai.com/v1
  #   path: /embeddings          # 留空用 /embeddings
  #   api_key: ${KUBEFLARE_AI__EMBEDDING__API_KEY}
  #   model: text-embedding-3-small
  #   timeout: 20s
  #   max_retries: 2
  #   retry_backoff: 500ms

# Agent loop(LLM 驱动的多步只读诊断)运行参数。
agent:
  max_steps: 10                # 单次运行最大 think-act 轮数(串行依赖链一跳一步;反思补证可再追加 max_reflection_steps 步)
  max_token_budget: 120000     # 单次运行累计 token 预算上限,0 表示不限。与 max_steps 成对调整:每步重发完整上下文,10 步约需 120k
  max_tool_errors_per_step: 3  # 连续无有效工具调用的最大步数,超过则强制收尾
  step_timeout: 60s            # 单步 LLM 调用超时
  tool_choice: auto            # 工具选择策略:auto / none / required
  llm_routing: true            # 用 LLM 做 Agent 路由分类(失败回退关键词规则),默认开
  stream_think: true           # think 阶段逐 token 流式输出 thinking 事件,默认开
  planning: true               # 取证前生成显式诊断计划(假设+验证步骤)并注入上下文,失败自动降级,默认开
  reflection: true             # 结论产出前做一次 critic 自检,证据不足时补充取证,失败保留原结论,默认开
  max_reflection_steps: 2      # 反思触发后允许追加的最大 think 步数(0-5),0 表示禁用补证
  max_reflections: 1           # 每次运行最大反思轮数(1-3,每轮一次 critic 调用),禁用反思请用 reflection: false
  reflection_jurors: 3         # 反思自检的评委数(对抗式多评委,多视角并发评审多数否决才打回);1 退化为单评委,钳到 1-5
  hypothesis_ledger: true      # 显式假设台账:把计划/剧本假设结构化为可记账的竞争假设,逐步取证确认或排除,支持鉴别诊断,默认开
  playbook: true               # 诊断剧本先验:命中高频故障(CrashLoopBackOff/OOMKilled/ImagePullBackOff/Pending/Service无Endpoint)时注入常见根因与排查路径并种子化假设台账,默认开
  replanning: false            # 动态重规划:取证途中每隔若干步基于已采集证据修订诊断计划,纠正被推翻的初始假设;需 planning 开启方生效,失败保留当前计划,默认关
  replan_interval: 3           # 两次重规划之间至少执行的步数(每步一次工具取证)
  max_replans: 2               # 每次运行的重规划次数上限(控成本)
  observe_compression: false   # 超长工具观察的智能压缩:超预算时用一次 LLM 调用按当前问题压缩关键信息,失败回退硬截断(每条超长观察多一次 LLM 调用,默认关)
  case_library: true           # 诊断案例库:run 成功后异步提取"症状→根因"案例,相似问题以 few-shot 回灌,默认开
  case_few_shot_limit: 3       # 注入提示的相似案例条数上限(0-8),0 表示只归档不注入
  case_cache_size: 2000        # 诊断案例内存缓存上限(语义检索在缓存内算相似度);放大可减少历史经验被淘汰,代价仅内存
  semantic_retrieval: true     # 案例/路由样例的语义向量检索,默认开;仅当上方 ai.embedding 已配置时生效,否则自动降级关键词匹配
  route_learning: true         # 记录用户显式选择 Agent 的反馈并以 few-shot 回灌路由提示,默认开
  route_few_shot_limit: 8      # 路由提示携带的历史确认样例条数上限(0-32)
  route_cache_size: 256        # 路由样例内存缓存上限(语义检索在缓存内算相似度);样例为短文本,放大成本极低
  max_concurrent_runs_per_user: 3  # 单用户并发执行的 Agent run 上限,0 表示不限(不推荐)
  max_concurrent_runs: 50          # 全实例并发执行的 Agent run 总上限,0 表示不限(不推荐)
  # 集群内 Prometheus 服务定位(经 K8s API Server 代理访问,无需额外凭证)。
  prometheus:
    namespace: monitoring                              # Prometheus 所在命名空间
    service: prometheus-kube-prometheus-prometheus     # Prometheus Service 名
    port: "9090"                                       # Service 端口
    scheme: http                                       # http / https
    query_timeout: 15s                                 # 单次查询超时
  # 可选:覆盖各 Agent 的系统提示词(内联优先,其次文件路径)
  # prompts:
  #   diagnostic: "自定义诊断提示词"
  # prompt_files:
  #   diagnostic: /etc/kubeflare/prompts/diagnostic.md
  # 可选:工具治理,不改代码即可启停工具或微调元数据(按工具 ID 覆盖,仅覆盖所列字段)
  # tools:
  #   overrides:
  #     cluster.pod.log.tail:
  #       enabled: true            # 启停该工具(false 则既不暴露给模型也不可调用)
  #       timeout_ms: 12000        # 覆盖单次执行超时(毫秒)
  #       observe_max_chars: 8000  # 覆盖单步回喂给 LLM 的观察文本上限(256-16000 字符)
  #     cluster.rbac.get:
  #       enabled: false           # 关闭 RBAC 读取工具
  # 可选:被动技能,按关键字命中后收窄工具集 + 追加专家提示(无额外 LLM 调用)。
  # 运行时可经 POST /agent/tool/reload 热重载(空请求体回滚到启动配置)。
  # skills:
  #   - id: diagnose.ingress-unreachable
  #     name: "Ingress 不通排查"
  #     enabled: true
  #     agent_types: [diagnostic]        # 留空表示适用于任意 Agent
  #     triggers: ["ingress", "访问不通", "503", "无法访问"]  # 命中任一即触发
  #     allowed_tools:                   # 收窄为这些工具(留空则不收窄)
  #       - cluster.ingress.get
  #       - cluster.service.get
  #       - cluster.pod.list
  #       - cluster.event.list
  #     system_prompt: "用户反馈服务从外部访问不通,按 Ingress→Service→Endpoint→Pod 顺序定位。"
  #     hints:
  #       - "先查 Ingress 规则与后端 Service 绑定"
  #       - "再查 Service 的 Endpoint 是否就绪"
  #       - "最后查后端 Pod 状态与事件"

database:
  enabled: true
  dsn: postgres://postgres:${KUBEFLARE_DB_PASSWORD}@127.0.0.1:5432/kubeflare?sslmode=disable
  max_open_conns: 40
  max_idle_conns: 20
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m
  query_timeout: 5s
  health_check_timeout: 2s

redis:
  enabled: true
  address: 127.0.0.1:6379
  username: ""
  password: ${KUBEFLARE_REDIS_PASSWORD}
  db: 0
  dial_timeout: 2s
  read_timeout: 2s
  write_timeout: 2s
  pool_timeout: 4s
  min_idle_conns: 4
  max_idle_conns: 16
  pool_size: 32
  cache_ttl: 2m
  health_check_timeout: 2s

secrets:
  encryption_key: ${KUBEFLARE_SECRETS__ENCRYPTION_KEY}

upload:
  root_dir: data/uploads

observability:
  log_level: info
  log_format: text
  tracing:
    enabled: false
